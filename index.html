<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https:; connect-src 'self' http: https: ws: wss:; media-src 'self' blob: data:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>ZuraAI</title>
    <script>
      ;(function () {
        try {
          var searchParams = new URLSearchParams(window.location.search || '')
          var hash = window.location.hash || ''
          var isCommandCenterRoute =
            searchParams.get('commandCenter') === '1' ||
            hash.indexOf('#/command-center') === 0 ||
            hash.indexOf('#command-center') === 0

          if (isCommandCenterRoute) {
            document.documentElement.classList.add('command-center-route')
          }

          var raw = localStorage.getItem('zura-settings')
          if (!raw) return
          var parsed = JSON.parse(raw)
          var mode = parsed.theme || 'dark'
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark)
          var root = document.documentElement
          root.classList.toggle('dark', isDark)
          root.style.colorScheme = isDark ? 'dark' : 'light'
        } catch (_error) {}
      })()
    </script>
    <style>
      :root {
        --theme-background: #1a1a1a;
        --theme-text-primary: rgba(255, 255, 255, 0.85);
        --theme-text-tertiary: rgba(255, 255, 255, 0.48);
        --theme-text-muted: rgba(255, 255, 255, 0.35);
        --theme-surface-hover: rgba(255, 255, 255, 0.06);
      }

      :root:not(.dark) {
        --theme-background: #ede7df;
        --theme-text-primary: #1f1a14;
        --theme-text-tertiary: rgba(31, 26, 20, 0.6);
        --theme-text-muted: rgba(31, 26, 20, 0.48);
        --theme-surface-hover: #dcd7cf;
      }

      #launch-fallback {
        background: var(--theme-background);
      }

      #fallback-text {
        color: var(--theme-text-primary);
      }

      #fallback-bar {
        background: var(--theme-surface-hover);
      }

      #fallback-bar > div {
        background: var(--theme-text-tertiary);
      }

      #fallback-slow {
        color: var(--theme-text-muted);
      }

      .command-center-route,
      .command-center-route body {
        background: transparent;
      }

      .command-center-route #root {
        background: rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(26px) saturate(118%);
        -webkit-backdrop-filter: blur(26px) saturate(118%);
      }

      .command-center-route #launch-fallback {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Fallback UI: visible until React mounts and replaces #root contents -->
      <div
        id="launch-fallback"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 2rem;
        "
      >
        <div
          id="fallback-text"
          style="
            font-family:
              -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            font-size: 34px;
            font-weight: 600;
            opacity: 0;
            animation: fb-fade 1.2s ease-out 0.1s forwards;
            letter-spacing: 0.08em;
            text-transform: uppercase;
          "
        >
          Zura
        </div>
        <div
          id="fallback-bar"
          style="
            width: 180px;
            height: 3px;
            margin-top: 28px;
            border-radius: 4px;
            overflow: hidden;
            opacity: 0;
            animation: fb-fade 0.6s ease-out 0.5s forwards;
          "
        >
          <div
            style="
              width: 40%;
              height: 100%;
              border-radius: 4px;
              animation: fb-slide 1.4s ease-in-out infinite;
            "
          ></div>
        </div>
        <div
          id="fallback-slow"
          style="
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 12px;
            margin-top: 24px;
            opacity: 0;
            transition: opacity 0.5s ease;
          "
        >
          This is taking unusually long. Try restarting the app.
        </div>
      </div>
      <style>
        @keyframes fb-fade {
          to {
            opacity: 1;
          }
        }
        @keyframes fb-slide {
          0% {
            transform: translateX(-100%);
          }
          50% {
            transform: translateX(250%);
          }
          100% {
            transform: translateX(-100%);
          }
        }
      </style>
      <script>
        setTimeout(function () {
          var el = document.getElementById('fallback-slow')
          if (el) el.style.opacity = '1'
        }, 10000)
      </script>
    </div>
    <noscript>
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: var(--theme-background, #14120b);
          color: var(--theme-text-muted, #a8a29e);
          font-family: sans-serif;
        "
      >
        JavaScript is required to run ZuraAI.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
