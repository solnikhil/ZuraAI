<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https:; connect-src 'self' http: https: ws: wss:; media-src 'self' blob: data:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'"
  />
  <title>Zura</title>


</head>

<body>
  <div id="root">
    <!-- Fallback UI: visible until React mounts and replaces #root contents -->
    <div id="launch-fallback" style="
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #14120B;
      text-align: center; padding: 2rem;
    ">
      <div id="fallback-text" style="
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
        font-size: 34px; color: #f2f2f7;
        font-weight: 600;
        opacity: 0; animation: fb-fade 1.2s ease-out 0.1s forwards;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      ">Zura</div>
      <div id="fallback-bar" style="
        width: 180px; height: 3px;
        margin-top: 28px;
        border-radius: 4px;
        background: rgba(255,255,255,0.06);
        overflow: hidden;
        opacity: 0; animation: fb-fade 0.6s ease-out 0.5s forwards;
      ">
        <div style="
          width: 40%; height: 100%;
          border-radius: 4px;
          background: rgba(200,200,210,0.45);
          animation: fb-slide 1.4s ease-in-out infinite;
        "></div>
      </div>
      <div id="fallback-slow" style="
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px; color: #57534e; margin-top: 24px;
        opacity: 0; transition: opacity 0.5s ease;
      ">This is taking unusually long. Try restarting the app.</div>
    </div>
    <style>
      @keyframes fb-fade { to { opacity: 1; } }
      @keyframes fb-slide {
        0%   { transform: translateX(-100%); }
        50%  { transform: translateX(250%); }
        100% { transform: translateX(-100%); }
      }
    </style>
    <script>
      setTimeout(function() {
        var el = document.getElementById('fallback-slow');
        if (el) el.style.opacity = '1';
      }, 10000);
    </script>
  </div>
  <noscript>
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#14120B;color:#a8a29e;font-family:sans-serif;">
      JavaScript is required to run ZuraAI.
    </div>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
