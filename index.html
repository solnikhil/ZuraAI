<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https:; connect-src 'self' http: https: ws: wss:; media-src 'self' blob: data:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'"
  />
  <title>Zura</title>
  
  <!-- Preconnect to font origins for faster DNS/TLS handshake -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  
  <!-- Preload critical fonts for above-the-fold content -->
  <!-- Google Sans Flex (primary UI font) - preload the CSS which triggers font loading -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=Sacramento&display=swap" as="style">
  
  <!-- Preload KaTeX main font (critical for math rendering) -->
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/katex@0.16.28/dist/fonts/KaTeX_Main-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/katex@0.16.28/dist/fonts/KaTeX_Math-Italic.woff2" as="font" type="font/woff2" crossorigin>
  
  <!-- Google Fonts - display=swap ensures text is visible with fallback font while loading -->
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
  
  <!-- KaTeX CSS for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.28/dist/katex.min.css" integrity="sha384-Wsr4Nh3yrvMf2KCebJchRJoVo1gTU6kcP05uRSh5NV3sj9+a8IomuJoQzf3sMq4T" crossorigin="anonymous">
</head>

<body>
  <div id="root">
    <!-- Fallback UI: visible until React mounts and replaces #root contents -->
    <div id="launch-fallback" style="
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #14120B;
      text-align: center; padding: 2rem;
    ">
      <div id="fallback-text" style="
        font-family: 'Sacramento', cursive;
        font-size: 52px; color: #d6d3d1;
        opacity: 0; animation: fb-fade 1.2s ease-out 0.1s forwards;
        letter-spacing: 2px;
      ">Zura</div>
      <div id="fallback-bar" style="
        width: 180px; height: 3px;
        margin-top: 28px;
        border-radius: 4px;
        background: rgba(255,255,255,0.06);
        overflow: hidden;
        opacity: 0; animation: fb-fade 0.6s ease-out 0.5s forwards;
      ">
        <div style="
          width: 40%; height: 100%;
          border-radius: 4px;
          background: rgba(200,200,210,0.45);
          animation: fb-slide 1.4s ease-in-out infinite;
        "></div>
      </div>
      <div id="fallback-slow" style="
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px; color: #57534e; margin-top: 24px;
        opacity: 0; transition: opacity 0.5s ease;
      ">This is taking unusually long. Try restarting the app.</div>
    </div>
    <style>
      @keyframes fb-fade { to { opacity: 1; } }
      @keyframes fb-slide {
        0%   { transform: translateX(-100%); }
        50%  { transform: translateX(250%); }
        100% { transform: translateX(-100%); }
      }
    </style>
    <script>
      setTimeout(function() {
        var el = document.getElementById('fallback-slow');
        if (el) el.style.opacity = '1';
      }, 10000);
    </script>
  </div>
  <noscript>
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#14120B;color:#a8a29e;font-family:sans-serif;">
      JavaScript is required to run ZuraAI.
    </div>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
