<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zura</title>
  
  <!-- Preconnect to font origins for faster DNS/TLS handshake -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  
  <!-- Preload critical fonts for above-the-fold content -->
  <!-- Google Sans Flex (primary UI font) - preload the CSS which triggers font loading -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=Sacramento&display=swap" as="style">
  
  <!-- Preload KaTeX main font (critical for math rendering) -->
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/fonts/KaTeX_Main-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/fonts/KaTeX_Math-Italic.woff2" as="font" type="font/woff2" crossorigin>
  
  <!-- Google Fonts - display=swap ensures text is visible with fallback font while loading -->
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
  
  <!-- KaTeX CSS for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
</head>

<body>
  <div id="root"></div>
  <!-- Polyfills for modern APIs not available in Electron 25's Chromium 114 -->
  <!-- Must be inline and before any module scripts to ensure they run first -->
  <script>
    // Polyfill for Promise.withResolvers (added in ES2024 / Node 22)
    if (typeof Promise.withResolvers === 'undefined') {
      Promise.withResolvers = function() {
        var resolve, reject;
        var promise = new Promise(function(res, rej) {
          resolve = res;
          reject = rej;
        });
        return { promise: promise, resolve: resolve, reject: reject };
      };
    }
    
    // Polyfill for URL.parse (added in Node 22.1.0)
    // Returns a URL object if valid, null if invalid (unlike new URL which throws)
    if (typeof URL.parse === 'undefined') {
      URL.parse = function(url, base) {
        try {
          return new URL(url, base);
        } catch (e) {
          return null;
        }
      };
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
