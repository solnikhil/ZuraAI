<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zura</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <!-- Polyfills for modern APIs not available in Electron 25's Chromium 114 -->
  <!-- Must be inline and before any module scripts to ensure they run first -->
  <script>
    // Polyfill for Promise.withResolvers (added in ES2024 / Node 22)
    if (typeof Promise.withResolvers === 'undefined') {
      Promise.withResolvers = function() {
        var resolve, reject;
        var promise = new Promise(function(res, rej) {
          resolve = res;
          reject = rej;
        });
        return { promise: promise, resolve: resolve, reject: reject };
      };
    }
    
    // Polyfill for URL.parse (added in Node 22.1.0)
    // Returns a URL object if valid, null if invalid (unlike new URL which throws)
    if (typeof URL.parse === 'undefined') {
      URL.parse = function(url, base) {
        try {
          return new URL(url, base);
        } catch (e) {
          return null;
        }
      };
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
