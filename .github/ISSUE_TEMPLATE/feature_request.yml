name: Feature request
description: Suggest an improvement that would make Zura AI better
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please describe the problem, the workflow, and why the change matters for Zura AI.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where should this change land?
      options:
        - Dashboard chat experience
        - Model or provider management
        - Tool calling or web research
        - Settings or personalization
        - Window shell or desktop integration
        - Performance or reliability
        - Build, packaging, or release flow
        - Developer experience or testing
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the pain point, missing workflow, or limitation.
      placeholder: I switch between several providers often, but it is hard to compare enabled models quickly in the selector.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the ideal behavior or UI.
      placeholder: Add a grouped comparison view in Settings that shows provider status, enabled models, and default selections in one place.
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Example workflow or use case
      description: Walk through a concrete scenario where this would help.
      placeholder: |
        1. Open Settings
        2. Review all configured providers
        3. Compare enabled models side by side
        4. Change the active model without opening each provider section
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Optional. Share workarounds or different solutions you thought about.
    validations:
      required: false

  - type: checkboxes
    id: considerations
    attributes:
      label: This request may involve
      description: Select anything that applies.
      options:
        - label: A UI or interaction redesign
        - label: A new provider, model capability, or tool
        - label: Changes to IPC, storage, or security boundaries
        - label: Packaging, updater, or release pipeline work

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Add mockups, links, architectural concerns, or implementation hints if you have them.
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: Interested in contributing?
      options:
        - Yes, I can open a PR
        - I can help refine the scope
        - No
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This is a product or engineering request for Zura AI, not a support question.
          required: true
        - label: I explained the user value, not just the implementation idea.
          required: true
