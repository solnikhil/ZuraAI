name: Bug report
description: Report a reproducible problem in Zura AI
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please keep the report focused on Zura AI itself.

        For security issues, use the private security reporting link instead of opening a public issue.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the app is affected?
      options:
        - Dashboard chat
        - Streaming or tool calling
        - Provider settings or model selection
        - Web research or search tools
        - Chat history or secure storage
        - Window shell or title bar
        - Build, packaging, or updater
        - Other
    validations:
      required: true

  - type: dropdown
    id: install-context
    attributes:
      label: Where did you hit the bug?
      options:
        - Packaged desktop app
        - Local dev build (npm run dev)
        - Renderer preview/build
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Zura AI is Windows-first, but reports from other platforms are still useful.
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Use the app version, release tag, or commit if you built from source.
      placeholder: e.g. 0.0.1 or main@abcdef1
    validations:
      required: true

  - type: dropdown
    id: providers
    attributes:
      label: Provider(s) involved
      description: Select any providers or services connected to the issue.
      multiple: true
      options:
        - OpenRouter
        - Ollama
        - Perplexity
        - Groq
        - Alibaba Cloud
        - Tavily or web search
        - None
        - Other
    validations:
      required: false

  - type: input
    id: models
    attributes:
      label: Model(s) involved
      description: Optional, but helpful for provider-specific issues.
      placeholder: e.g. gpt-4o-mini, qwen-max, llama3.1:8b
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug clearly and include the impact.
      placeholder: When I send a message with web research enabled, the response stream stops after the first tool call.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Share the shortest path that reproduces the problem.
      placeholder: |
        1. Open Zura AI
        2. Go to Settings and enable...
        3. Return to Dashboard and send...
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      placeholder: The chat should continue streaming after the tool result returns.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or recordings
      description: Paste stack traces, console output, or screenshots here. Please remove API keys and personal data.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include anything else that may matter, such as whether this regressed, only happens with one provider, or only happens with an existing profile.
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: Interested in contributing a fix?
      options:
        - Yes, I can open a PR
        - I can help test a fix
        - No
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same bug.
          required: true
        - label: I removed or redacted secrets, API keys, and personal data from the report.
          required: true
        - label: I believe this is a bug in Zura AI rather than a general provider outage or support question.
          required: true
