name: Setup Bun and install dependencies
description: Setup Bun with cache and install dependencies
inputs:
  bun-version:
    description: Bun version to install (defaults to the version pinned by docs/MAINTENANCE.md)
    required: false
    default: '1.3.14'
runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Print Bun version
      shell: bash
      run: bun --version

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
