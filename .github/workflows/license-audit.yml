name: License Audit

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lockb"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run license audit
        run: bunx tsx scripts/license-audit.ts
