name: License Audit

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run license audit
        run: npx tsx scripts/license-audit.ts
