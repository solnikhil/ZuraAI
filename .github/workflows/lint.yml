name: Lint

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'images/**'
      - 'docs/**'
      - 'research/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'images/**'
      - 'docs/**'
      - 'research/**'

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # lint: ESLint + Prettier, gated through the quality ratchet.
  #
  # The repository carries pre-existing lint/format debt (see
  # quality-baseline.json). Blanket continue-on-error made new regressions
  # indistinguishable from that debt, so instead the ratchet fails only on
  # findings that are NOT in the baseline. This is a required gate.
  #
  # The baseline may only shrink. Burn it down with `bun run quality:baseline`
  # after fixing findings; once a check reaches zero, drop it from the baseline
  # and enforce the raw command directly.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Block newly introduced lint and formatting findings
        run: bun run quality:ratchet

      - name: ESLint (full report, informational)
        if: always()
        continue-on-error: true
        run: bun run lint

      - name: Prettier (full report, informational)
        if: always()
        continue-on-error: true
        run: bun run format:check
