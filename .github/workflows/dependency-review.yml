name: Dependency Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "package.json"
      - "bun.lock"
      - "package-lock.json"

permissions:
  contents: read
  # pull-requests: write is required so the action can post the
  # vulnerability summary as an inline PR comment on failure.
  pull-requests: write

# Cancel in-progress runs for the same PR.
concurrency:
  group: dep-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # review: scan PR diff for newly introduced vulnerable dependencies and
  # disallowed licenses (GPL/AGPL families).
  # ---------------------------------------------------------------------------
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0
