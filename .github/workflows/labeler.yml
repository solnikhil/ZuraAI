name: Labeler

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

# Cancel in-progress runs for the same PR.
concurrency:
  group: labeler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # label: apply path-derived labels (area: ui, area: mcp, dependencies, ...)
  # to every PR. Uses pull_request_target so labels can be applied to PRs from
  # forks. Note that pull_request_target checks out the BASE branch; the
  # action only reads `.github/labeler.yml` from base, never executes PR
  # source, so this is the safe pattern for fork support.
  # ---------------------------------------------------------------------------
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels
        uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
