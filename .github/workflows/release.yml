name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: 20

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Windows artifacts
        run: npm run build

      - name: Verify packaged release artifacts
        shell: pwsh
        run: |
          $requiredPatterns = @(
            'release/Zura-Setup-*.exe',
            'release/Zura-Setup-*.exe.blockmap',
            'release/latest.yml'
          )

          foreach ($pattern in $requiredPatterns) {
            $matches = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue
            if (-not $matches) {
              throw "Missing expected release artifact: $pattern"
            }
          }

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          # Find the previous tag for changelog range
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(npx tsx scripts/generate-changelog.ts --from-tag "$PREV_TAG" --to-ref "$CURRENT_TAG")
          else
            CHANGELOG=$(npx tsx scripts/generate-changelog.ts --to-ref "$CURRENT_TAG")
          fi

          # Write changelog to a file for the release step
          echo "$CHANGELOG" > release-notes.md

      - name: Compute SHA-256 checksums
        id: checksums
        shell: pwsh
        run: |
          $artifacts = @(
            Get-ChildItem -Path 'release/Zura-Setup-*.exe'
            Get-ChildItem -Path 'release/Zura-Setup-*.exe.blockmap'
            Get-ChildItem -Path 'release/latest.yml'
          ) | Sort-Object Name

          Set-Content -Path checksums.md -Value '## SHA-256 Checksums'
          Add-Content -Path checksums.md -Value ''
          Add-Content -Path checksums.md -Value '```'

          foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -Path $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Content -Path checksums.md -Value "$hash  $($artifact.Name)"
          }

          Add-Content -Path checksums.md -Value '```'
          Add-Content -Path release-notes.md -Value ''
          Get-Content -Path checksums.md | Add-Content -Path release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            release/Zura-Setup-*.exe
            release/Zura-Setup-*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
