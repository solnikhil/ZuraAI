name: Knip

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'images/**'
      - 'docs/**'
      - 'research/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'images/**'
      - 'docs/**'
      - 'research/**'

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch.
concurrency:
  group: knip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # knip: unused dependency / export / file detection, gated through the
  # quality ratchet.
  #
  # Existing findings are recorded in quality-baseline.json; the ratchet fails
  # only on new ones. This is a required gate. The baseline may only shrink -
  # use `bun run quality:baseline` after fixing findings.
  # ---------------------------------------------------------------------------
  knip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Block newly introduced dead-code findings
        run: bun run quality:ratchet --only=knip

      - name: Knip (full report, informational)
        if: always()
        continue-on-error: true
        run: bun run knip --reporter compact
