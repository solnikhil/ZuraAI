name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly Monday 04:00 UTC. Independent from PR/CI traffic.
    - cron: '0 4 * * 1'
  push:
    branches:
      - main

permissions: read-all

# One run at a time per ref; this is a low-frequency posture check.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # analysis: run OpenSSF Scorecard checks (Branch-Protection, Code-Review,
  # Pinned-Dependencies, Token-Permissions, ...) and publish results to the
  # GitHub Security tab via SARIF. Public repos can also publish a public
  # badge at https://securityscorecards.dev when publish_results: true.
  # ---------------------------------------------------------------------------
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required by ossf/scorecard-action to write results to Security tab.
      security-events: write
      # Required for publishing results to securityscorecards.dev (OIDC).
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Public results allow the badge endpoint at api.securityscorecards.dev
          # to render a real-time score without exposing source. Safe for public
          # repos; toggle off if the repo is private.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
