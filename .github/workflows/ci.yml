name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Branch protection: require the "test" job to pass before merging.
# Required status checks (configure in repo Settings > Branches > main):
#   - CI / test
#   - CodeQL / analyze
#   - Secret Scan / gitleaks
#   - License Audit / audit (on dependency changes)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Renderer build
        run: bun run build:renderer
