name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Branch protection: require the "test" job to pass before merging.
# Required status checks (configure in repo Settings > Branches > main):
#   - CI / test
#   - CodeQL / analyze
#   - Secret Scan / gitleaks
#   - License Audit / audit (on dependency changes)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Renderer build
        run: npm run build:renderer
