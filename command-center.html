<!doctype html>
<html lang="en" class="command-center-route">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https:; connect-src 'self' http: https: ws: wss:; media-src 'self' blob: data:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>ZuraAI Command Center</title>
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('zura-settings')
          var parsed = raw ? JSON.parse(raw) : {}
          var mode = parsed.theme || 'dark'
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark)
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch (_error) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/commandCenterMain.tsx"></script>
  </body>
</html>
